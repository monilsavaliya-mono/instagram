name = "dm-automation-test-lab"
main = "worker.js"
compatibility_date = "2024-09-23"

# One or more allowed CORS origins, comma-separated.
# Replace with your GitHub Pages origin after deployment, e.g.
# "https://YOUR_USERNAME.github.io"
# Use "*" only for quick local testing - never for a real deployment.
[vars]
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "dm_automation_test_lab"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
