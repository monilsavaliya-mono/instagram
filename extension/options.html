<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Browser Control - Settings</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 24px auto; color: #1a1a2e; }
  h1 { font-size: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  button { padding: 8px 14px; font-weight: 600; cursor: pointer; }
  #status { margin-top: 16px; padding: 10px; border-radius: 8px; font-size: 13px; }
  .ok { background: #e3f7ea; color: #1f9d55; }
  .bad { background: #fdeaea; color: #d94f4f; }
  .warn { background: #fff2da; color: #c98a12; }
  .hint { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Browser Control - Settings</h1>
  <p class="hint">
    This extension lets an external tool (holding the API key below) read and
    interact with your browser tabs through a relay you deploy yourself.
    Anyone with this key can control this browser while it is connected -
    treat it like a password.
  </p>

  <label for="relayUrl">Relay URL</label>
  <input type="text" id="relayUrl" placeholder="https://browser-control-relay.YOUR-SUBDOMAIN.workers.dev" />

  <label for="apiKey">API key</label>
  <input type="password" id="apiKey" placeholder="a long random secret you choose" />

  <div class="row">
    <input type="checkbox" id="allowEval" />
    <label for="allowEval" style="margin:0;">Allow EVAL (arbitrary JS execution on pages) - leave off unless you need it</label>
  </div>

  <div class="row">
    <button id="save">Save &amp; Connect</button>
  </div>

  <div id="status"></div>

  <script src="dist/options.js"></script>
</body>
</html>
