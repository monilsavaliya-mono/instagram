name = "browser-control-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# One BrowserSession Durable Object per registered API key - it holds the
# extension's live WebSocket connection and routes REST calls into it.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "BrowserSession"

[[migrations]]
tag = "v1"
# SQLite-backed storage class - required for Durable Objects on the free plan
# (the classic new_classes key-value backend requires the paid plan).
new_sqlite_classes = ["BrowserSession"]
